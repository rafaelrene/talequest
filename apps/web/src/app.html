<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        const themeKey = "tq_theme";
        const isTheme = (value) => value === "light" || value === "dark";
        const cookieTheme = document.cookie
          .split(";")
          .map((entry) => entry.trim())
          .find((entry) => entry.startsWith(`${themeKey}=`))
          ?.slice(themeKey.length + 1);
        const storageTheme = localStorage.getItem(themeKey);
        const initialTheme = isTheme(storageTheme)
          ? storageTheme
          : isTheme(cookieTheme)
            ? cookieTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";

        document.documentElement.setAttribute("data-theme", initialTheme);
        localStorage.setItem(themeKey, initialTheme);
        document.cookie = `${themeKey}=${initialTheme}; Path=/; Max-Age=31536000; SameSite=Lax`;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
